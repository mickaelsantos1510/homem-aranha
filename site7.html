 <ins><h1>FORMULÁRIO</h1></ins>

<br>
<br>

<form action="/submit-shipping" method="post">
    <fieldset>
        <legend>Informações de Envio</legend>

        <label for="nome_completo">Nome Completo:</label>
        <input type="text" id="nome_completo" name="nome_completo" required>

        <label for="endereco">Endereço (Rua, Av., etc.):</label>
        <input type="text" id="endereco" name="endereco" required>

        <label for="numero">Número:</label>
        <input type="text" id="numero" name="numero" required size="5">

        <label for="complemento">Complemento (Apto, Bloco, etc.):</label>
        <input type="text" id="complemento" name="complemento">

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" name="bairro" required>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="estado">Estado (UF):</label>
        <input type="text" id="estado" name="estado" required size="2" maxlength="2">

        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep" required
               pattern="[0-9]{5}-[0-9]{3}" title="Formato: 12345-678"
               size="10" maxlength="9">

        <label for="pais">País:</label>
        <input type="text" id="pais" name="pais" value="Brasil" required>

        <label for="mensagem">Deixe sua mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5"
            placeholder="Escreva aqui sua mensagem para o Aranhaverso..."></textarea>
    </fieldset>

    <input type="submit" value="Enviar Formulário">
</form>

<br><br>


<button id="btnTopo">🕷️</button>
